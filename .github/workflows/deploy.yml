name: Deploy to Production

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: techieroshan/railshouse

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 209.182.235.68
          username: deployuser
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 6150
          script: |
            set -e
            cd /home/deployuser/railshouse
            test -f .env
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ghcr.io/techieroshan/railshouse:latest
            sudo docker compose -f docker-compose.prod.yml --env-file .env up -d railshouse-db
            for i in {1..30}; do
              DB_STATUS=$(sudo docker inspect --format="{{.State.Health.Status}}" railshouse-db 2>/dev/null || echo starting)
              [ "$DB_STATUS" = "healthy" ] && break
              [ "$i" -eq 30 ] && { echo "DB_HEALTH_TIMEOUT"; sudo docker logs --tail 80 railshouse-db; exit 1; }
              sleep 2
            done
            sudo docker compose -f docker-compose.prod.yml --env-file .env run --rm railshouse ./bin/rails db:prepare
            sudo docker compose -f docker-compose.prod.yml --env-file .env up -d railshouse
            for i in {1..40}; do
              APP_STATUS=$(sudo docker inspect --format="{{.State.Health.Status}}" railshouse-app 2>/dev/null || echo starting)
              [ "$APP_STATUS" = "healthy" ] && break
              [ "$i" -eq 40 ] && { echo "APP_HEALTH_TIMEOUT"; sudo docker logs --tail 120 railshouse-app; exit 1; }
              sleep 3
            done
            curl -sSI http://127.0.0.1:6154/ | head -n 1
            sudo docker image prune -f
            echo "Deployed railshouse $(date)"
