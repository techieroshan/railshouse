services:
  railshouse-db:
    image: postgres:16-alpine
    container_name: railshouse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=railshouse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=railshouse_production
    volumes:
      - railshouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railshouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  railshouse:
    image: ghcr.io/techieroshan/railshouse:latest
    container_name: railshouse-app
    restart: unless-stopped
    depends_on:
      railshouse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:6154:3000"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=1
      - RAILS_SERVE_STATIC_FILES=1
      - APP_HOST=${APP_HOST:-www.railshouse.com}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DATABASE_URL=postgresql://railshouse:${POSTGRES_PASSWORD}@railshouse-db:5432/railshouse_production
    volumes:
      - railshouse_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  railshouse_pgdata:
  railshouse_storage:
